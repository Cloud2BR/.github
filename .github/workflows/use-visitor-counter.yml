name: Refresh Repository Metadata

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metadata:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/update-repository-metadata.yml
    permissions:
      contents: write
    secrets: inherit